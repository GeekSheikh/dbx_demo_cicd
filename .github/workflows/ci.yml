name: CI

on:
  push:
    branches: [ main, master, develop, cicd_enable ]
  pull_request:
    branches: [ main, master, develop, cicd_enable ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: '3.12'
        environment-file: environment.yml
        activate-environment: py312dbx
    
    - name: Cache conda packages
      uses: actions/cache@v4
      with:
        path: ~/conda_pkgs_dir
        key: ${{ runner.os }}-conda-${{ hashFiles('**/environment.yml', '**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-conda-
    
    - name: Install dependencies
      shell: bash -l {0}
      run: |
        pip install -r requirements.txt
    
    - name: Lint with flake8
      shell: bash -l {0}
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Format check with black
      shell: bash -l {0}
      run: |
        black --check --diff .
    
    - name: Run pytest with coverage
      shell: bash -l {0}
      run: |
        pytest tests/ --cov=tools --cov-report=term-missing --cov-report=xml --cov-report=html -v
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
      if: always()

